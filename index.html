<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Electric Meter Calculator</title>
    <style>
        /* General Styles */
        :root {
            --primary: #007bff;
            --secondary: #6c757d;
            --success: #28a745;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            height: fit-content;
        }

        /* Tabs Styling */
        .tabs {
            display: flex;
            background: #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #555;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        /* Content Area */
        .content {
            padding: 25px;
            display: none; /* Hidden by default */
        }

        .content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h2 { text-align: center; color: #333; margin-top: 0; }
        
        /* Form Elements */
        .input-group { margin-bottom: 15px; }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1rem; /* Larger for mobile tapping */
            box-sizing: border-box; 
        }

        input:focus { border-color: var(--primary); outline: none; }

        .btn-calc {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .btn-calc:hover { background-color: #0056b3; }

        /* Result Box */
        .result-box {
            background: #eef7ff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            border-left: 5px solid var(--primary);
            display: none;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .total {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            border-top: 1px solid #ccc;
            padding-top: 10px;
            margin-top: 5px;
        }

        /* History List */
        #history-list {
            list-style: none;
            padding: 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-info { font-size: 0.9rem; color: #555; }
        .history-cost { font-weight: bold; color: var(--success); }
        .history-date { font-size: 0.75rem; color: #999; display: block;}

        .btn-clear {
            width: 100%;
            padding: 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calculator')">Calculator</button>
            <button class="tab-btn" onclick="switchTab('history')">History</button>
        </div>

        <!-- Tab 1: Calculator -->
        <div id="calculator" class="content active">
            <h2>⚡ Bill Computation</h2>
            
            <div class="input-group">
                <label>Previous Month Reading (kWh)</label>
                <input type="number" id="prevRead" placeholder="e.g. 5354.7" step="0.1">
            </div>

            <div class="input-group">
                <label>This Month Reading (kWh)</label>
                <input type="number" id="currRead" placeholder="e.g. 5437.8" step="0.1">
            </div>

            <div class="input-group">
                <label>Electricity Rate (PHP per kWh)</label>
                <input type="number" id="rate" placeholder="e.g. 12.50" step="0.01">
                <small style="color: #888; font-size: 0.8rem;">Check your bill for the total rate per kWh.</small>
            </div>

            <button class="btn-calc" onclick="calculate()">Compute Bill</button>

            <div id="result" class="result-box">
                <div class="result-row">
                    <span>Consumption:</span>
                    <span id="res-kwh">0 kWh</span>
                </div>
                <div class="result-row total">
                    <span>Total Amount:</span>
                    <span id="res-total">₱0.00</span>
                </div>
            </div>
        </div>

        <!-- Tab 2: History -->
        <div id="history" class="content">
            <h2>Saved Computations</h2>
            <div id="no-history" style="text-align: center; color: #999; margin-top: 20px;">No history yet.</div>
            <ul id="history-list">
                <!-- Items will be added here by JS -->
            </ul>
            <button class="btn-clear" onclick="clearHistory()">Clear All History</button>
        </div>
    </div>

    <script>
        // Initialize History on Load
        document.addEventListener("DOMContentLoaded", loadHistory);

        // --- Tab Logic ---
        function switchTab(tabName) {
            // Hide all contents
            document.querySelectorAll('.content').forEach(div => div.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            // Show selected
            document.getElementById(tabName).classList.add('active');
            
            // Highlight button
            const btnIndex = tabName === 'calculator' ? 0 : 1;
            document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');
        }

        // --- Calculation Logic ---
        function calculate() {
            const prev = parseFloat(document.getElementById('prevRead').value);
            const curr = parseFloat(document.getElementById('currRead').value);
            const rate = parseFloat(document.getElementById('rate').value);

            // Validation
            if (isNaN(prev) || isNaN(curr) || isNaN(rate)) {
                alert("Please fill in all fields correctly.");
                return;
            }

            if (curr < prev) {
                alert("Current reading cannot be lower than previous reading.");
                return;
            }

            // Math
            const kwhUsed = (curr - prev).toFixed(2);
            const totalCost = (kwhUsed * rate);

            // Display Results
            document.getElementById('res-kwh').innerText = `${kwhUsed} kWh`;
            document.getElementById('res-total').innerText = formatPHP(totalCost);
            document.getElementById('result').style.display = 'block';

            // Save to History
            addToHistory(prev, curr, kwhUsed, totalCost);
        }

        function formatPHP(amount) {
            return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(amount);
        }

        // --- History Logic (using LocalStorage) ---
        function addToHistory(prev, curr, kwh, total) {
            const historyItem = {
                date: new Date().toLocaleString(),
                prev: prev,
                curr: curr,
                kwh: kwh,
                total: total
            };

            let history = JSON.parse(localStorage.getItem('meterHistory')) || [];
            history.unshift(historyItem); // Add to top
            localStorage.setItem('meterHistory', JSON.stringify(history));
            
            loadHistory(); // Refresh list
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('meterHistory')) || [];
            const list = document.getElementById('history-list');
            const noHistMsg = document.getElementById('no-history');

            list.innerHTML = ''; // Clear current list

            if (history.length === 0) {
                noHistMsg.style.display = 'block';
                return;
            } else {
                noHistMsg.style.display = 'none';
            }

            history.forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div class="history-info">
                        <span class="history-date">${item.date}</span>
                        Read: ${item.prev} → ${item.curr}<br>
                        Used: <strong>${item.kwh} kWh</strong>
                    </div>
                    <div class="history-cost">${formatPHP(item.total)}</div>
                `;
                list.appendChild(li);
            });
        }

        function clearHistory() {
            if(confirm('Are you sure you want to delete all history?')) {
                localStorage.removeItem('meterHistory');
                loadHistory();
            }
        }
    </script>

</body>
</html>
