<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Meter App</title>
    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --primary: #007bff;
            --secondary: #6c757d;
            --success: #28a745;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --danger: #dc3545;
            --border: #dee2e6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Aligns to top */
            min-height: 100vh;
        }

        /* --- CONTAINER (The Card) --- */
        .container {
            width: 100%;
            max-width: 480px; /* Mobile Default Width */
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: max-width 0.3s ease;
        }

        /* --- TABS (Mobile Only) --- */
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 18px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.2s;
            position: relative;
        }

        .tab-btn.active {
            background: #fff;
            color: var(--primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--primary);
        }

        /* --- CONTENT AREAS --- */
        .content {
            padding: 25px;
            display: none; /* Hidden by default on mobile */
        }

        .content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { margin-top: 0; color: #333; font-size: 1.4rem; text-align: center; margin-bottom: 20px; }

        /* --- FORM ELEMENTS --- */
        .input-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #495057;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1.1rem;
            background: #f8f9fa;
            box-sizing: border-box; 
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            background: #fff;
            outline: none;
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,123,255,0.2);
            transition: background 0.2s;
        }
        .btn-main:hover { background-color: #0056b3; }

        /* --- RESULTS --- */
        .result-box {
            background: #e7f5ff;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            display: none;
            border: 1px solid #b8daff;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #495057;
        }

        .total {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            border-top: 2px solid #b8daff;
            padding-top: 15px;
            margin-top: 10px;
            align-items: center;
        }

        /* --- HISTORY LIST --- */
        #history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 350px; /* Scrollable area */
            overflow-y: auto;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }

        /* Custom scrollbar for history */
        #history-list::-webkit-scrollbar { width: 6px; }
        #history-list::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 4px;}

        .history-item {
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }

        .h-date { font-size: 0.75rem; color: #999; margin-bottom: 4px; display: block; }
        .h-details { font-size: 0.9rem; color: #555; }
        .h-cost { font-size: 1rem; font-weight: bold; color: var(--success); }

        .btn-group { display: flex; gap: 10px; }
        .btn-download { flex: 2; padding: 12px; background: var(--success); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-clear { flex: 1; padding: 12px; background: #fff; color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; font-weight: 600; cursor: pointer; }

        .storage-warning {
            background: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; display: none; text-align: center;
        }

        /* --- DESKTOP VIEW (The Magic Part) --- */
        @media (min-width: 900px) {
            .container {
                max-width: 950px; /* Make card wide */
                flex-direction: row; /* Side by side */
            }

            /* Hide Tabs on Desktop */
            .tabs { display: none !important; }

            /* Force Show Both Sections */
            .content {
                display: block !important;
                flex: 1; /* Split 50/50 */
                padding: 40px; /* More breathing room */
            }

            /* Add Divider Line */
            #calculator {
                border-right: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tabs (Only visible on Phone) -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calculator')">Calculator</button>
            <button class="tab-btn" onclick="switchTab('history')">History</button>
        </div>

        <!-- Left Side: Calculator -->
        <div id="calculator" class="content active">
            <h2>⚡ Compute Bill</h2>
            
            <div class="input-group">
                <label>Previous Reading (kWh)</label>
                <input type="number" id="prevRead" placeholder="0" step="0.1" inputmode="decimal">
            </div>

            <div class="input-group">
                <label>Current Reading (kWh)</label>
                <input type="number" id="currRead" placeholder="0" step="0.1" inputmode="decimal">
            </div>

            <div class="input-group">
                <label>Rate (PHP per kWh)</label>
                <input type="number" id="rate" placeholder="0.00" step="0.01" inputmode="decimal">
            </div>

            <button class="btn-main" onclick="calculate()">Compute</button>

            <div id="result" class="result-box">
                <div class="result-row">
                    <span>Previous:</span>
                    <span id="display-prev">-</span>
                </div>
                <div class="result-row">
                    <span>Current:</span>
                    <span id="display-curr">-</span>
                </div>
                <div class="result-row" style="color: #333; font-weight:600;">
                    <span>Consumed:</span>
                    <span id="res-kwh">0 kWh</span>
                </div>
                <div class="result-row total">
                    <span>Total:</span>
                    <span id="res-total">₱0.00</span>
                </div>
            </div>
        </div>

        <!-- Right Side: History -->
        <div id="history" class="content">
            <h2>History Log</h2>
            
            <div id="storage-alert" class="storage-warning">
                ⚠️ Browser storage blocked. Download CSV to save.
            </div>

            <div id="no-history" style="text-align: center; color: #999; padding: 20px;">No records yet.</div>
            
            <ul id="history-list">
                <!-- Javascript fills this -->
            </ul>

            <div class="btn-group" id="history-actions" style="display:none;">
                <button class="btn-download" onclick="downloadHistory()">📥 CSV</button>
                <button class="btn-clear" onclick="clearHistory()">Clear</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Startup Logic ---
        document.addEventListener("DOMContentLoaded", () => {
            loadHistory();
            try {
                localStorage.setItem('test', '1');
                localStorage.removeItem('test');
            } catch (e) {
                document.getElementById('storage-alert').style.display = 'block';
            }
        });

        // --- 2. Tab Logic (Mobile Only) ---
        function switchTab(tabName) {
            // This function only affects Mobile view. 
            // On Desktop, CSS overrides 'display:none' so this logic is ignored visually.
            document.querySelectorAll('.content').forEach(div => div.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            const btnIndex = tabName === 'calculator' ? 0 : 1;
            document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');
        }

        // --- 3. Calculation Logic ---
        function calculate() {
            const prev = parseFloat(document.getElementById('prevRead').value);
            const curr = parseFloat(document.getElementById('currRead').value);
            let rate = parseFloat(document.getElementById('rate').value);

            // Auto-load last rate
            if (isNaN(rate)) {
                const lastRate = localStorage.getItem('lastRate');
                if (lastRate) {
                    rate = parseFloat(lastRate);
                    document.getElementById('rate').value = rate;
                }
            }

            if (isNaN(prev) || isNaN(curr) || isNaN(rate)) {
                alert("Please check your numbers.");
                return;
            }

            if (curr < prev) {
                alert("Current reading cannot be lower than Previous.");
                return;
            }

            const kwhUsed = (curr - prev).toFixed(2);
            const totalCost = (kwhUsed * rate);

            // Update UI
            document.getElementById('display-prev').innerText = prev;
            document.getElementById('display-curr').innerText = curr;
            document.getElementById('res-kwh').innerText = `${kwhUsed} kWh`;
            document.getElementById('res-total').innerText = formatPHP(totalCost);
            document.getElementById('result').style.display = 'block';

            // Save
            saveToHistory(prev, curr, kwhUsed, totalCost, rate);
            localStorage.setItem('lastRate', rate);
        }

        function formatPHP(amount) {
            return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(amount);
        }

        // --- 4. History Logic ---
        function saveToHistory(prev, curr, kwh, total, rate) {
            const newItem = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                prev: prev,
                curr: curr,
                kwh: kwh,
                rate: rate,
                total: total
            };

            let history = getHistoryData();
            history.unshift(newItem); 
            
            try {
                localStorage.setItem('electricHistory', JSON.stringify(history));
            } catch (e) {
                // Storage full
            }
            loadHistory();
        }

        function getHistoryData() {
            const raw = localStorage.getItem('electricHistory');
            return raw ? JSON.parse(raw) : [];
        }

        function loadHistory() {
            const history = getHistoryData();
            const list = document.getElementById('history-list');
            const noHist = document.getElementById('no-history');
            const actions = document.getElementById('history-actions');

            list.innerHTML = '';

            if (history.length === 0) {
                noHist.style.display = 'block';
                actions.style.display = 'none';
                return;
            }

            noHist.style.display = 'none';
            actions.style.display = 'flex';

            history.forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div>
                        <span class="h-date">${item.date}</span>
                        <div class="h-details">
                            ${item.prev} → ${item.curr} (${item.kwh}kWh)
                        </div>
                    </div>
                    <div class="h-cost">${formatPHP(item.total)}</div>
                `;
                list.appendChild(li);
            });
        }

        // --- 5. Download & Clear ---
        function downloadHistory() {
            const history = getHistoryData();
            if (history.length === 0) return;

            let csv = "Date,Previous,Current,Consumption,Rate,Total\n";
            history.forEach(row => {
                const cleanDate = row.date.replace(',', ''); 
                csv += `${cleanDate},${row.prev},${row.curr},${row.kwh},${row.rate},${row.total.toFixed(2)}\n`;
            });

            const link = document.createElement("a");
            link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
            link.download = `Bill_History_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearHistory() {
            if(confirm("Delete all history?")) {
                localStorage.removeItem('electricHistory');
                loadHistory();
            }
        }
    </script>
</body>
</html>
