<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Bill Calculator</title>
    <style>
        /* --- PROFESSIONAL RAVENCLAW PALETTE --- */
        :root {
            --royal-blue: #0e1a40;       /* Deep Navy */
            --accent-bronze: #b08d55;    /* Muted Gold/Bronze */
            --bg-light: #f4f6f9;         /* Clean Blue-Grey White */
            --card-white: #ffffff;
            --text-dark: #333333;
            --text-muted: #666666;
            --danger: #c0392b;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* --- CARD CONTAINER --- */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-white);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(14, 26, 64, 0.15);
            border-top: 6px solid var(--royal-blue);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: max-width 0.4s ease;
        }

        /* --- TYPOGRAPHY --- */
        h2 { 
            margin-top: 0; 
            color: var(--royal-blue); 
            font-size: 1.4rem; 
            font-weight: 700;
            text-align: center; 
            margin-bottom: 25px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--accent-bronze);
            margin-top: 25px;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            font-weight: 700;
        }
        h3:first-of-type { margin-top: 0; }

        /* --- TABS (Mobile) --- */
        .tabs {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--royal-blue);
            border-bottom: 3px solid var(--royal-blue);
            background: #fdfdfd;
        }

        /* --- LAYOUT --- */
        .content {
            padding: 30px;
            display: none;
        }
        .content.active {
            display: block;
            animation: fade 0.3s ease;
        }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* --- INPUTS --- */
        .input-group { margin-bottom: 15px; }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--royal-blue);
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1.05rem;
            background: #fafafa;
            box-sizing: border-box; 
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--royal-blue);
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(14, 26, 64, 0.1);
        }

        /* --- MAIN BUTTON --- */
        .btn-main {
            width: 100%;
            padding: 16px;
            background-color: var(--royal-blue);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s;
            text-transform: uppercase;
            margin-top: 20px;
        }
        .btn-main:hover { 
            background-color: #1a2b5e; 
            box-shadow: 0 4px 12px rgba(14, 26, 64, 0.2);
        }

        /* --- RESULTS --- */
        .result-box {
            background: #f8fbff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            display: none;
            border: 1px solid #e1e8f0;
            border-left: 4px solid var(--accent-bronze);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .total {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--royal-blue);
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 10px;
            align-items: center;
        }

        /* --- HISTORY LIST --- */
        #history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 400px; 
            overflow-y: auto;
            margin-bottom: 20px;
        }

        #history-list::-webkit-scrollbar { width: 5px; }
        #history-list::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 10px; }

        .history-item {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }

        .h-date { font-size: 0.75rem; color: #999; display: block; margin-bottom: 4px; }
        .h-details { font-size: 0.9rem; color: #444; }
        .h-cost { font-size: 1.1rem; font-weight: bold; color: var(--royal-blue); }

        /* --- HISTORY ACTIONS --- */
        .btn-group { 
            display: flex; 
            gap: 10px; 
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            background: #fff;
            border: 1px solid var(--royal-blue);
            color: var(--royal-blue);
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-action:hover {
            background: var(--royal-blue);
            color: white;
        }

        .btn-action.clear {
            border-color: var(--danger);
            color: var(--danger);
            flex: 0.3; 
        }
        .btn-action.clear:hover {
            background: var(--danger);
            color: white;
        }

        .storage-warning {
            background: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 20px; display: none; text-align: center; border: 1px solid #ffeeba;
        }

        /* --- DESKTOP VIEW --- */
        @media (min-width: 900px) {
            .container {
                max-width: 960px;
                flex-direction: row;
            }
            .tabs { display: none !important; }
            .content {
                display: block !important;
                flex: 1; 
                padding: 40px;
            }
            #calculator {
                border-right: 1px solid #eee;
            }
            #history {
                background: #fbfbfb; /* Very subtle grey for history side */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tabs (Mobile Only) -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calculator')">Calculator</button>
            <button class="tab-btn" onclick="switchTab('history')">History</button>
        </div>

        <!-- Left Side: Calculator -->
        <div id="calculator" class="content active">
            <h2>Calculate Bill</h2>
            
            <!-- Step 1: Main Bill Info -->
            <h3>1. Main Bill Details</h3>
            <div class="input-group">
                <label>Total Bill Amount (PHP)</label>
                <input type="number" id="mainBillAmount" placeholder="Total Amount to Pay" step="0.01" inputmode="decimal">
            </div>

            <div class="input-group">
                <label>Total Consumption (kWh)</label>
                <input type="number" id="mainTotalKwh" placeholder="Total kWh Used" step="0.1" inputmode="decimal">
            </div>

            <!-- Step 2: User Meter Info -->
            <h3>2. My Meter Reading</h3>
            <div class="input-group">
                <label>Previous Reading (kWh)</label>
                <input type="number" id="prevRead" placeholder="0" step="0.1" inputmode="decimal">
            </div>

            <div class="input-group">
                <label>Current Reading (kWh)</label>
                <input type="number" id="currRead" placeholder="0" step="0.1" inputmode="decimal">
            </div>

            <button class="btn-main" onclick="calculate()">Compute Amount</button>

            <!-- Results -->
            <div id="result" class="result-box">
                <div class="result-row">
                    <span>Reading Range:</span>
                    <span><span id="display-prev">0</span> — <span id="display-curr">0</span></span>
                </div>
                <div class="result-row" style="color: var(--royal-blue); font-weight:600;">
                    <span>My Consumption:</span>
                    <span id="res-kwh">0 kWh</span>
                </div>
                <div class="result-row">
                    <span>Effective Rate:</span>
                    <span id="res-rate">₱0.00 / kWh</span>
                </div>
                <div class="result-row total">
                    <span>My Share:</span>
                    <span id="res-total">₱0.00</span>
                </div>
            </div>
        </div>

        <!-- Right Side: History -->
        <div id="history" class="content">
            <h2>Billing History</h2>
            
            <div id="storage-alert" class="storage-warning">
                ⚠️ Browser storage is blocked. Please use Export CSV to save data.
            </div>

            <div id="no-history" style="text-align: center; color: #aaa; padding: 40px 20px;">
                No billing records found.
            </div>
            
            <ul id="history-list">
                <!-- JS fills this -->
            </ul>

            <div class="btn-group" id="history-actions" style="display:none;">
                <button class="btn-action" onclick="downloadHistory()">
                    <span>📥</span> Export CSV
                </button>
                <button class="btn-action clear" onclick="clearHistory()">
                    <span>🗑️</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Startup Logic ---
        document.addEventListener("DOMContentLoaded", () => {
            loadHistory();
            // Try to load previous MAIN bill inputs for convenience
            const lastMainBill = localStorage.getItem('lastMainBill');
            const lastMainKwh = localStorage.getItem('lastMainKwh');
            if(lastMainBill) document.getElementById('mainBillAmount').value = lastMainBill;
            if(lastMainKwh) document.getElementById('mainTotalKwh').value = lastMainKwh;

            try {
                localStorage.setItem('test', '1');
                localStorage.removeItem('test');
            } catch (e) {
                document.getElementById('storage-alert').style.display = 'block';
            }
        });

        // --- 2. Tab Logic ---
        function switchTab(tabName) {
            document.querySelectorAll('.content').forEach(div => div.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            const btnIndex = tabName === 'calculator' ? 0 : 1;
            document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');
        }

        // --- 3. Calculation Logic ---
        function calculate() {
            // Get Main Bill Inputs
            const mainBill = parseFloat(document.getElementById('mainBillAmount').value);
            const mainKwh = parseFloat(document.getElementById('mainTotalKwh').value);

            // Get Meter Inputs
            const prev = parseFloat(document.getElementById('prevRead').value);
            const curr = parseFloat(document.getElementById('currRead').value);

            // Validation
            if (isNaN(mainBill) || isNaN(mainKwh) || isNaN(prev) || isNaN(curr)) {
                alert("Please fill in all fields with valid numbers.");
                return;
            }

            if (mainKwh === 0) {
                alert("Total Main Consumption cannot be zero.");
                return;
            }

            if (curr < prev) {
                alert("Current reading cannot be lower than Previous reading.");
                return;
            }

            // Calculation
            const computedRate = mainBill / mainKwh;
            const myKwhUsed = (curr - prev).toFixed(2);
            const myTotalCost = (myKwhUsed * computedRate);

            // Update UI Results
            document.getElementById('display-prev').innerText = prev;
            document.getElementById('display-curr').innerText = curr;
            document.getElementById('res-kwh').innerText = `${myKwhUsed} kWh`;
            document.getElementById('res-rate').innerText = `${formatPHP(computedRate)} / kWh`;
            document.getElementById('res-total').innerText = formatPHP(myTotalCost);
            document.getElementById('result').style.display = 'block';

            // Save for user convenience (Main bill inputs often stay similar)
            localStorage.setItem('lastMainBill', mainBill);
            localStorage.setItem('lastMainKwh', mainKwh);

            // Save to History Log
            saveToHistory(prev, curr, myKwhUsed, myTotalCost, computedRate);
        }

        function formatPHP(amount) {
            return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(amount);
        }

        // --- 4. History Logic ---
        function saveToHistory(prev, curr, kwh, total, rate) {
            const newItem = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                prev: prev,
                curr: curr,
                kwh: kwh,
                rate: rate.toFixed(4), // Store rate precisely
                total: total
            };

            let history = getHistoryData();
            history.unshift(newItem); 
            
            try {
                localStorage.setItem('profHistory', JSON.stringify(history));
            } catch (e) {}
            loadHistory();
        }

        function getHistoryData() {
            const raw = localStorage.getItem('profHistory');
            return raw ? JSON.parse(raw) : [];
        }

        function loadHistory() {
            const history = getHistoryData();
            const list = document.getElementById('history-list');
            const noHist = document.getElementById('no-history');
            const actions = document.getElementById('history-actions');

            list.innerHTML = '';

            if (history.length === 0) {
                noHist.style.display = 'block';
                actions.style.display = 'none';
                return;
            }

            noHist.style.display = 'none';
            actions.style.display = 'flex';

            history.forEach(item => {
                const formattedRate = parseFloat(item.rate).toFixed(2);
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div>
                        <span class="h-date">${item.date}</span>
                        <div class="h-details">
                            ${item.prev} → <strong>${item.curr}</strong> (${item.kwh}kWh @ ${formattedRate})
                        </div>
                    </div>
                    <div class="h-cost">${formatPHP(item.total)}</div>
                `;
                list.appendChild(li);
            });
        }

        // --- 5. Download & Clear ---
        function downloadHistory() {
            const history = getHistoryData();
            if (history.length === 0) return;

            let csv = "Date,Previous,Current,Consumption,ComputedRate,Total\n";
            history.forEach(row => {
                const cleanDate = row.date.replace(',', ''); 
                csv += `${cleanDate},${row.prev},${row.curr},${row.kwh},${row.rate},${row.total.toFixed(2)}\n`;
            });

            const link = document.createElement("a");
            link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
            link.download = `Bill_Records_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearHistory() {
            if(confirm("Are you sure you want to clear the history logs?")) {
                localStorage.removeItem('profHistory');
                loadHistory();
            }
        }
    </script>
</body>
</html>
